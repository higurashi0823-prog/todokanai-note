<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>届かない課 調査ノート</title>
<style>
:root{--ink:#2B2A33;--ink2:#5E5866;--line:#CDBF9F;--post:#B8372D;--air:#2C4A7A;--navy:#2C3552;--kraft:#EFE4CB;--paper:#FBF7EE;--blueink:#2B3A67;--gold:#D9A441;--green:#2E7D4F;--bg:#E9E2D2;
  --dot:"DotGothic16","MS Gothic",monospace;--maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--hand:"Klee One","Yu Mincho","Hiragino Mincho ProN",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
table{color:inherit;font-size:inherit;line-height:inherit;font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--maru);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--dot);letter-spacing:.15em;font-size:15px}.brand b{display:block;font-size:20px;letter-spacing:.1em}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.who input{width:9em;padding:5px 8px;border:1px solid #6B7390;border-radius:6px;background:#3A4366;color:var(--paper)}
.wallet{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:700}
.wallet svg{width:26px;height:26px}.wallet small{font-weight:500;color:var(--ink2);font-size:12px}
.tabs{max-width:880px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.tab{flex:0 0 auto;padding:6px 12px;border:1px solid #5A6385;border-radius:8px;background:#3A4366;color:var(--paper);font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
.tab.lock{opacity:.7}
main{max-width:880px;margin:0 auto;padding:16px 16px 60px}
.slider{position:relative}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.slide{flex:0 0 100%;scroll-snap-align:center;background:#EEE5CF;border-radius:10px;padding:10px;min-width:0}
.slide .fig{container-type:inline-size;width:100%}.slide .fig .mapc,.slide .fig .envs,.slide .fig .doc{width:100%!important;max-width:100%;transform:none}
.slide .mapc{padding:6px}.slide .mapc svg{width:100%;height:auto}
.slide .mapc svg text{font-size:inherit}
.slide .figs{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.slide .mapc .ml{font-size:30px}.slide .mapc .ms{font-size:25px}.slide .mapc .al{font-size:26px}}
.slide .fig{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(15,15,25,.92);display:flex;flex-direction:column}
.zoom .zb{display:flex;justify-content:flex-end;padding:10px}.zoom .zb button{padding:8px 16px;border:none;border-radius:8px;background:#fff;font-weight:700}
.zoom .zc{flex:1;overflow:auto;padding:0 10px 20px;-webkit-overflow-scrolling:touch}.zoom .zc .fig{width:max(900px,100%);cursor:default}.zoom .zc .mapc,.zoom .zc .envs,.zoom .zc .doc{width:100%!important}
.slide .no{font-family:var(--dot);font-size:12px;color:var(--post);letter-spacing:.15em;margin:0 0 4px 4px}.slide .cap{margin:8px 4px 2px;font-size:15px;line-height:1.7}.slide .cap b{color:var(--post)}
.snav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.snav .dots{display:flex;gap:6px}.snav .dot{width:9px;height:9px;border-radius:50%;background:#C9BFA6}.snav .dot.on{background:var(--post)}
.snav button{padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.ask{position:fixed;inset:0;z-index:20;background:rgba(20,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ask .box{max-width:420px;width:100%;background:var(--paper);border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}.ask p{margin:0 0 14px;font-size:15px}.ask .row{display:flex;gap:8px;justify-content:flex-end}
.panel{background:var(--paper);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
h2{margin:0 0 10px;font-family:var(--dot);font-weight:400;font-size:17px;letter-spacing:.15em;color:var(--post)}
.ep-title{margin:0 0 4px;font-size:22px}.ep-no{font-family:var(--dot);color:var(--post);letter-spacing:.2em;font-size:13px}
.unlock{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.unlock input{flex:1;min-width:10em;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:18px;letter-spacing:.1em}
.btn{padding:9px 16px;border:none;border-radius:8px;background:var(--post);color:#fff;font-weight:700;cursor:pointer}
.btn.sub{background:var(--navy)}.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.msg{margin:8px 0 0;font-size:13px;color:var(--post)}
.letter{padding:12px 16px;background:#FFFEFA;border:1px solid #DCCFB4;background-image:linear-gradient(transparent 31px,#E3D7BD 31px);background-size:100% 32px;font-family:var(--hand);color:var(--blueink);line-height:32px}
.letter p{margin:0}.letter .from{text-align:right}
.mech{margin:0;padding-left:1.2em}.mech li{margin-bottom:4px}.mech b{color:var(--post)}
.rules{margin:8px 0 0;padding-left:1.2em;font-size:13px;color:var(--ink2)}.rules b{color:var(--post)}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0}
.sc .pt{height:110px}.sc .pt svg{display:block;width:100%;height:100%}
.sc .tx{padding:8px 10px}.sc .nm{font-weight:700;font-size:16px}.sc .rl{font-size:11px;color:var(--ink2)}.sc .sy{font-size:12.5px;line-height:1.5;margin-top:4px}
.sc.clear .pt{filter:grayscale(1);opacity:.5}
.sc .stamp{position:absolute;top:34px;left:50%;transform:translateX(-50%) rotate(-12deg);padding:2px 10px;border:3px solid var(--blueink);border-radius:6px;color:var(--blueink);font-weight:700;background:rgba(255,255,255,.8)}
.sc.absent .pt{filter:grayscale(1);opacity:.55}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0}
.evi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--kraft);overflow:hidden}
.card.front{position:relative;padding:20px 14px 12px;min-height:118px;display:flex;flex-direction:column;cursor:pointer;text-align:left;width:100%}
.card.front::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(-45deg,var(--post) 0 8px,#fff 8px 12px,var(--air) 12px 20px,#fff 20px 24px)}
.card.front.hint::before{background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,#fff 8px 16px)}
.card .k{font-family:var(--dot);font-size:12px;letter-spacing:.25em;color:#8A6F45}
.card .n{font-weight:700;font-size:16px;margin-top:2px}
.card .c{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:#6B5A3E}.card .c svg{width:20px;height:20px}
.card.back{background:#fff;padding:12px 14px}
.dc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:4px;margin-bottom:4px;border-bottom:2px solid var(--ink)}
.dc-h b{font-size:15px;letter-spacing:.1em}.dc-h span{font-size:11px;color:var(--ink2);text-align:right}
.dl{display:grid;grid-template-columns:6em 1fr;margin:0}
.dl dt,.dl dd{margin:0;padding:4px 0;border-bottom:1px dashed var(--line)}.dl dt{font-size:12px;color:var(--ink2)}
.hand{font-family:var(--hand);color:var(--blueink)}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:3px 4px;border-bottom:1px dashed var(--line);text-align:left;font-size:13px}.tb th{font-size:11px;font-weight:500;color:var(--ink2)}
.nt{margin:6px 0 0;font-size:12px;color:var(--ink2)}
.hp{margin:0 0 4px;font-family:var(--hand);color:var(--blueink)}.pp{margin:0 0 4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{padding:2px 6px;border:1px dashed #B5A98C;font-family:var(--hand);color:var(--blueink)}
.hint-q{margin:6px 0 0;font-family:var(--hand);color:var(--blueink);font-size:16px}
.acc label{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
.skill{margin:4px 0 0;padding:10px 12px;border-radius:8px;background:#EEF1F7;line-height:1.7}.skill b{color:var(--post);font-size:17px}
.big{margin:6px 0 10px;font-size:44px;font-weight:700;color:var(--post);line-height:1.1}.big small{font-size:18px;color:var(--ink2);margin-left:4px}.big .pr{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-top:4px}
.tb.res td{padding:6px 6px;font-size:14px;vertical-align:top}

.fld{padding:2px 8px 8px;margin:4px -8px;border-radius:8px}.fld.bad{background:#FBE3DF;outline:2px solid var(--post)}
.fe{margin:4px 0 0;color:var(--post);font-weight:700;font-size:13px}
.req{margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--post);color:#fff;font-size:11px;font-style:normal}.opt{margin-left:8px;padding:1px 6px;border-radius:4px;background:#E4DDCB;color:var(--ink2);font-size:11px;font-style:normal}
.ask .box p{white-space:normal}
.acc select,.acc textarea,.acc input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.acc .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.code{margin:10px 0 0;padding:12px;border:2px dashed var(--post);border-radius:8px;background:#fff;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.done{padding:10px 12px;border-radius:8px;background:#EAF3EC;color:var(--green);font-weight:700}
.log{font-size:12px;color:var(--ink2)}
footer{max-width:880px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.acc .two{grid-template-columns:1fr}.who{margin-left:0;width:100%}}
</style></head>

  const picks = [...new Set(rec.k)], bad = picks.filter(i => !a.keyIdx.includes(i)).length, hasCore = picks.some(i => a.coreIdx.includes(i));

      : `<button type="button" class="card front hint" data-hint="${i}"><span class="k">ヒント</span><span class="n">ヒント ${i+1}</span><span class="c">${COIN}調査費1枚で見る</span></button>`).join('');
  const sus = d.sus.map(s => `<button type="button" class="sc${e.clear.includes(s.id)?' clear':''}${s.absent?' absent':''}" data-sus="${s.id}" aria-pressed="${e.clear.includes(s.id)}">
      <div class="pt" style="background:${s.bg}">${s.svg}</div><div class="tx"><div class="rl">${esc(s.role)}</div><div class="nm">${esc(s.name)}</div><div class="sy">${esc(s.say)}</div></div>${e.clear.includes(s.id)?'<span class="stamp">潔白</span>':''}</button>`).join('');
  $('main').innerHTML = `
  <div class="panel"><div class="ep-no">${esc(m.label)}</div><p class="ep-title">${esc(d.title)}</p></div>
  <div class="panel"><h2>依頼書</h2><div class="letter"><p>郵便局 届かない課 御中</p>${d.letter.lines.map(l=>`<p>${esc(l)}</p>`).join('')}<p class="from">差出人　${esc(d.letter.from)}</p></div></div>
  <div class="panel"><h2>${esc(d.mechTitle)}</h2>${d.slides && d.slides.length ? `<div class="slider"><div class="track" id="trk">${d.slides.map((s,i)=>`<div class="slide"><p class="no">しくみ ${i+1} / ${d.slides.length}</p><div class="figs"><div class="fig">${s.svg}</div></div><p class="cap">${s.text}</p></div>`).join('')}</div><div class="snav"><button type="button" data-sl="-1">← 前へ</button><span class="dots" id="dts">${d.slides.map(()=>'<i class="dot"></i>').join('')}</span><button type="button" data-sl="1">次へ →</button></div><p class="note">横にスワイプするか、ボタンで進みます（${d.slides.length}枚）。図をタップすると拡大します。</p>` : `<ul class="mech">${d.mech.map(x=>`<li>${x}</li>`).join('')}</ul>`}<ul class="rules">${d.rules.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="panel"><h2>関係者の話</h2><div class="sus">${sus}</div><p class="note">押すと「潔白」の印がつきます（自分用のメモ）。</p></div>
  <div class="panel"><h2>物証</h2><div class="evi">${evi}</div></div>
  ${d.hints.length ? `<div class="panel"><h2>ヒント</h2><div class="evi">${hints}</div></div>` : ''}
  <div class="panel acc" id="accp"></div><div class="panel" id="subp" hidden></div>`;
  drawAcc(id, d, e); drawSub();
  const trk = $('trk'); if (trk) { const dts = [...document.querySelectorAll('#dts .dot')]; const mark = () => { const i = Math.round(trk.scrollLeft / trk.clientWidth); dts.forEach((x, k) => x.classList.toggle('on', k === i)); }; trk.onscroll = mark; mark(); }
}
/* 集計に出すコード：告発した話（練習をのぞく）の分を1つにまとめる */
function drawSub() {
  const box = $('subp'); if (!box) return;
  const codes = DATA.eps.filter(m => !m.practice && (st.eps[m.id] || {}).acc).map(m => ({m, c: st.eps[m.id].acc}));
  if (!(st.eps.s4 || {}).acc) { box.hidden = true; return; }
  const all = codes.map(x => x.c).join('\n');
  box.hidden = false;
  box.innerHTML = `<h2>集計に出すコード</h2><p class="note" style="margin:0 0 6px">告発した話（${codes.map(x => esc(x.m.label)).join('・')}）の分を、1つにまとめました。<b>いちばん最後（冬の告発のあと）に1回だけ</b>、ひぐらしさんにDMで送ってください。</p>
   <div class="code" id="allc">${esc(all)}</div><p><button type="button" class="btn" id="cpall">全部コピーする</button> <span class="log" id="cpallm"></span></p>`;
  $('cpall').onclick = async () => { try { await navigator.clipboard.writeText(all); $('cpallm').textContent = 'コピーしました'; } catch(err) { const rg = document.createRange(); rg.selectNodeContents($('allc')); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); $('cpallm').textContent = '選択しました。Ctrl+C でコピーしてください'; } };
}
function drawAcc(id, d, e) {
  const box = $('accp');
  if (e.acc) {
    const r = e.res || grade(d, JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(e.acc.slice(3).replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)))), wallet(id));
    const mark = o => o === true ? '<span class="ok">○</span>' : o === '△' ? '<span class="tri">△</span>' : '<span class="ng">×</span>';
    const prac = d.ans.practice;
    box.innerHTML = `<h2>採点結果</h2><p class="done">告発しました。結果は次のとおりです。</p>
     <p class="big">${r.pts}<small> / ${r.max} 点</small>${prac ? '<span class="pr">練習なので、得点には数えません</span>' : ''}</p>
     <table class="tb res">${r.parts.map(p => `<tr><td>${mark(p.ok)} ${p.name}</td><td class="r">${p.p} / ${p.max}</td><td class="det">${p.name === '決め手' ? '' : '正解：'}${esc(p.detail)}</td></tr>`).join('')}</table>
     <p class="note">決め手は、犯人を直接示す記録（◎）を1枚は入れて、関係が薄い記録（×）を選ばないと2点になります。</p>
     ${(!prac && id === 's4') ? `<p class="note">冬は、残った調査費も1枚1点です：${r.left}枚 → <b>+${r.left}点</b></p>` : ''}
     <h2 style="margin-top:14px">つまり、こういうこと</h2><ol class="summ">${d.ans.summary.map(x => `<li>${x}</li>`).join('')}</ol>
     <h2 style="margin-top:14px">今回使った考え方</h2><p class="skill"><b>${esc(d.ans.skill[0])}</b>　${esc(d.ans.skill[1])}</p>
`;
    return; }
  /* 選んだ内容は、選ぶたびにその場で保存する（画面が描き直されても消えない） */
  const dr = e.draft || (e.draft = {});
  const opt = (arr, ph, key, only) => `<option value="">${ph}</option>` + arr.map((x, i) => (only && !only.includes(i)) ? '' : `<option value="${i}"${dr[key] === String(i) ? ' selected' : ''}>${esc(x)}</option>`).join('');
  const pick = (id, arr, ph, only) => {
    const items = arr.map((x, i) => ({x, i})).filter(o => !only || only.includes(o.i));
    const cur = dr[id] === undefined ? '' : String(dr[id]);
    const curItem = items.find(o => String(o.i) === cur);
    const lab = curItem ? curItem.x : (cur === '' && ph && items.length && arr === undefined ? ph : '');
    if (!items.length) return `<div class="pick" id="${id}"><p class="pk-none">${ph}</p></div>`;
    const one = (v, label, extra) => `<button type="button" class="pk${cur === String(v) ? ' on' : ''}${extra || ''}" data-f="${id}" data-v="${v}" aria-pressed="${cur === String(v)}">${esc(label)}</button>`;
    const optPh = ph || '';   // 先頭に「使わない」などの選択肢を出すとき
    return `<div class="pick dd" id="${id}"><button type="button" class="dd-t${curItem ? ' set' : ''}" data-dd="${id}" aria-expanded="false"><span class="dd-v">${curItem ? esc(curItem.x) : (optPh && cur === '' && dr['__' + id] ? esc(optPh) : '選ぶ')}</span><span class="dd-a">▼</span></button><div class="dd-l" hidden>${optPh ? one('', optPh, ' none') : ''}${items.map(o => one(o.i, o.x)).join('')}</div></div>`;
  };
  const names = d.sus.map(s => s.name);
  const keys = d.evi.map(c => c.name);
  const got = e.bought.slice();   // 買った物証の番号
  if (dr['a-k1'] && !got.includes(+dr['a-k1'])) delete dr['a-k1'];
  if (dr['a-k2'] && !got.includes(+dr['a-k2'])) delete dr['a-k2'];
  const F = [];   // 入力項目（必須かどうか・名前・id）
  const row = (id, label, html, req = true) => { F.push({id, label, req}); return `<div class="fld" id="f-${id}"><label for="${id}">${label}${req ? '<em class="req">必須</em>' : '<em class="opt">任意</em>'}</label>${html}<p class="fe" id="e-${id}" hidden></p></div>`; };
  box.innerHTML = `<h2>告発（一度きり）</h2><p class="note" style="margin:0 0 6px">「必須」の項目をすべて選ぶと、告発できます。決め手の2枚には、<b>犯人を直接示す記録</b>を1枚は入れてください。関係のない記録を選ぶと減点です。</p>
   ${d.places.length ? row('a-p', esc(d.accWhere), pick('a-p', d.places, ''))  : ''}
   ${row('a-c', '犯人は', pick('a-c', names, ''))}
   ${d.second ? row('a-s', 'ほかにも原因はある？', pick('a-s', ['ない'].concat(names), '')) : ''}
   ${row('a-k1', '決め手① （買った物証）', pick('a-k1', keys, got.length ? '' : '先に物証を買ってください（調査費1枚でめくれます）', got))}
   ${row('a-k2', '決め手② （買った物証・①とちがうもの）', pick('a-k2', keys, got.length ? '' : '先に物証を買ってください（調査費1枚でめくれます）', got))}
   ${row('a-l', '決め手になった依頼書の一文', pick('a-l', d.letter.lines, '使わない（選ばなくてよい）'), false)}
   ${row('a-r', 'なぜそう言える？（自分用のメモ。提出はしない）', `<textarea id="a-r" rows="3">${esc(dr['a-r'] || '')}</textarea>`, false)}
   <p><button type="button" class="btn" id="a-go">告発する</button></p><p class="msg" id="a-m"></p>`;
  const val = k => { const v = dr[k]; return v === undefined || v === null ? '' : String(v); };
  box.addEventListener('click', ev => {
    const t = ev.target.closest('.dd-t');
    if (t) { const l = t.parentNode.querySelector('.dd-l'); const open = l.hidden; box.querySelectorAll('.dd-l').forEach(x => { x.hidden = true; }); box.querySelectorAll('.dd-t').forEach(x => x.setAttribute('aria-expanded', 'false')); l.hidden = !open; t.setAttribute('aria-expanded', String(open)); return; }
    const b = ev.target.closest('.pk'); if (!b) return; const f = b.dataset.f; dr[f] = b.dataset.v; if (b.dataset.v === '') dr['__' + f] = 1; save();
    box.querySelectorAll('.pk[data-f="' + f + '"]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
    const dd = b.closest('.dd'); if (dd) { dd.querySelector('.dd-l').hidden = true; const tt = dd.querySelector('.dd-t'); tt.setAttribute('aria-expanded', 'false'); tt.classList.toggle('set', b.dataset.v !== ''); dd.querySelector('.dd-v').textContent = b.dataset.v === '' ? b.textContent : b.textContent; }
    const fe = $('e-' + f); if (fe) fe.hidden = true; const fl = $('f-' + f); if (fl) fl.classList.remove('bad'); });
  box.addEventListener('input', ev => { const el = ev.target.closest('textarea'); if (el) { dr[el.id] = el.value; save(); } });
  $('a-go').onclick = () => {
    const miss = []; F.forEach(f => { const fl = $('f-' + f.id), fe = $('e-' + f.id); const empty = f.req && val(f.id) === ''; if (fl) fl.classList.toggle('bad', empty); if (fe) { fe.hidden = !empty; fe.textContent = empty ? ((f.id === 'a-k1' || f.id === 'a-k2') && !got.length ? '物証を買っていないので選べません。上の「物証」で調査費を払って、先にめくってください' : 'ここを選んでください') : ''; } if (empty) miss.push(f); });
    if (val('a-k1') !== '' && val('a-k1') === val('a-k2')) { const fe = $('e-a-k2'); $('f-a-k2').classList.add('bad'); fe.hidden = false; fe.textContent = '決め手①と②は、ちがう物証を選んでください'; miss.push({id:'a-k2', label:'決め手②（①とちがう物証を選ぶ）'}); }
    if (!st.name) { miss.unshift({id:'nm', label:'名前（いちばん上）'}); }
    if (miss.length) { $('a-m').innerHTML = '未入力：' + miss.map(f => '<b>' + f.label.replace(/<[^>]+>/g,'') + '</b>').join('、'); const first = miss[0]; const el = $(first.id === 'nm' ? 'nm' : 'f-' + first.id); if (el) { el.scrollIntoView({block:'center', behavior:'smooth'}); if (first.id === 'nm') el.focus(); } return; }
    const sel = k => { const b = box.querySelector('.pk[data-f="' + k + '"].on'); return b && b.dataset.v !== '' ? b.textContent : '（なし）'; };
    const summary = (d.places.length ? `${d.accWhere.replace(/<[^>]+>/g,'')}：${sel('a-p')}\n` : '') + `犯人：${sel('a-c')}\n` + (d.second ? `ほかの原因：${sel('a-s')}\n` : '') + `決め手：${sel('a-k1')} ／ ${sel('a-k2')}\n依頼書の一文：${sel('a-l')}`;
    ask('この内容で告発します。告発は一度きりです。\n\n' + summary, '告発する', 'もう少し考える').then(ok => { if (!ok) return;
      const rec = {v:1, e:id, n:st.name, p:val('a-p')===''?null:+val('a-p'), c:d.sus[+val('a-c')].id, s:d.second ? (val('a-s')==='0' ? 'none' : d.sus[+val('a-s')-1].id) : null,
        k:[val('a-k1'), val('a-k2')].filter(x => x!=='').map(Number), l:val('a-l')==='' ? null : +val('a-l'), u:e.used, r:wallet(id)};
      const bytes = new TextEncoder().encode(JSON.stringify(rec));
      e.acc = 'HG-' + btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      e.res = grade(d, rec, wallet(id));
      save(); draw(); window.scrollTo({top: $('accp').getBoundingClientRect().top + scrollY - 120, behavior: 'smooth'}); });
  };
}
document.addEventListener('click', ev => {
  const fg = ev.target.closest('.slide .fig'); if (fg) { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<div class="zb"><button type="button">とじる</button></div><div class="zc"><div class="fig">${fg.innerHTML}</div></div>`; z.querySelector('button').onclick = () => z.remove(); document.body.appendChild(z); return; }
  const sl = ev.target.closest('[data-sl]'); if (sl) { const trk = $('trk'); if (trk) trk.scrollBy({left: +sl.dataset.sl * trk.clientWidth, behavior: 'smooth'}); return; }
  const t = ev.target.closest('[data-id],[data-buy],[data-hint],[data-sus]'); if (!t) return;
  const id = st.cur, e = ep(id);
  if (t.dataset.id) { st.cur = t.dataset.id; save(); draw(); window.scrollTo(0,0); return; }
  if (t.dataset.sus) { const s = t.dataset.sus, i = e.clear.indexOf(s); if (i<0) e.clear.push(s); else e.clear.splice(i,1); save(); draw(); return; }
  const buy = async (list, i, what) => { if (wallet(id) < 1) { await ask('調査費が足りません。', 'とじる', ''); return; }
    if (!(await ask(`調査費を1枚払って、${what}を見ますか？\n（残り ${wallet(id)} 枚 → ${wallet(id)-1} 枚）`, '払って見る', 'やめる'))) return; pay(id); list.push(i); save(); draw(); };
  if (t.dataset.buy) buy(e.bought, +t.dataset.buy, '「' + plain[id].evi[+t.dataset.buy].name + '」');
  if (t.dataset.hint) buy(e.hints, +t.dataset.hint, 'ヒント');
});
$('nm').addEventListener('change', () => { st.name = $('nm').value.trim(); save(); });
$('reset').onclick = async () => { if ((await ask('調査費も、めくった物証も、告発も、全部消えます。最初からやり直しますか？', '消す', 'やめる')) && (await ask('本当に消しますか？', '本当に消す', 'やめる'))) { try { localStorage.removeItem(KEY); } catch(e) {} location.reload(); } };
/* 開いたことのある話は、保存した合言葉で開き直す */
(async () => { for (const m of DATA.eps) { const e = st.eps[m.id]; if (e && e.pass) { try { plain[m.id] = await open(m, e.pass); } catch(err) {} } } draw(); })();
draw();
})();
</script>
</body></html>
